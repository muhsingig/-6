<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services — Stay Purr cat sitting</title>
  <meta name="description" content="Daily visits, half-day care and overnight stays for cats, in the comfort of their own home.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bayon&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="services">
<div data-site="header"></div>

<main class="services__wrap">
  <h1 class="services__title h0 js-intro-lines">our services</h1>
  <section class="services__tips">
    <p class="services__tip h10 js-intro-fade">help to ensure your furry family member</p>
    <p class="services__tip h10 js-intro-fade">is as happy as can be!</p>
  </section>

  <section class="services__details">
    <div class="services__cat-wrap">
      <div class="services__cat" data-art="lyingCat"></div>
      <a href="book.html" class="services__circle-wrap" aria-label="Book a visit"><span class="services__ring" data-ring="let's book a visit" data-fill="#ffffff" data-color="#2f3bd1" data-size="38"></span></a>
    </div>
    <div class="services__details-content">
      <span class="services__arrow-wrap" data-art="icon.arrowDown"></span>
      <div class="white-circle__sm"></div>
      <div class="white-circle__xl"></div>
      <h2 class="services__details-title h4 js-lines">our services are built around your cat’s unique needs</h2>
      <span class="services__small-icon" data-art="smallYarn"></span>
      <p class="services__details-description h10 js-fade">Every visit is planned around your cat’s routine, so you can rest assured they get the highest level of care and attention in the comfort of their own home.</p>
    </div>
  </section>

  <section class="services__list">
    <div class="svc-tabs" id="svc-tabs"></div>
    <div class="svc-panel" id="svc-panel"></div>
  </section>

  <section data-site="inst"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/art.js"></script>
<script src="js/core.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
