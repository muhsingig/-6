<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book now — Stay Purr cat sitting</title>
  <meta name="description" content="Book a Stay Purr cat sitter in six quick steps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bayon&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="book" data-preloader="off" class="book-body">
<main class="book-now">
  <header class="book-now__header">
    <a href="index.html" class="book-now__logo" aria-label="Stay Purr home"><span data-art="logoCat" class="header-cat"></span></a>
    <a href="index.html" class="btn-cross js-book-close" aria-label="Close booking">
      <svg width="43" height="14" viewBox="0 0 43 14"><rect x="0" y="6" width="43" height="2" class="close-rect-modal1" fill="currentColor"/><rect x="0" y="6" width="43" height="2" class="close-rect-modal2" fill="currentColor"/></svg>
    </a>
  </header>

  <section class="book-now__wrap">
    <button class="book-now__btn-back p2-medium" id="book-back">← back</button>
    <div class="book-now__top">
      <div class="book-form__wrap">
        <h1 class="book-form__title h6" id="book-title"></h1>
        <div class="book-form__body" id="book-body"></div>
      </div>
    </div>
    <div class="book-now__bottom">
      <p class="book-now__steps p2-medium" id="book-count">1-6</p>
      <button class="book-now__next btn-dot" id="book-next" disabled style="--bg-btn-color:var(--c-ink);--text-btn-color:var(--c-gray2)"><span class="button-wrap"><span class="button-wrap__content"><span class="button-wrap__left-circle"></span><span class="button-wrap__text h9">next</span><span class="button-wrap__right-circle"></span></span></span></button>
    </div>
    <div class="book-now__progress"><span id="book-bar"></span></div>

    <div class="book-thanks">
      <div class="book-thanks__cat" data-art="catFace:0"></div>
      <p class="h4">thank you! our sitter manager will contact you soon</p>
      <p class="p2-medium" id="book-thanks-name"></p>
      <a href="index.html" class="btn-dot" style="--bg-btn-color:var(--c-ink);--text-btn-color:var(--c-gray2)"><span class="button-wrap"><span class="button-wrap__content"><span class="button-wrap__left-circle"></span><span class="button-wrap__text h9">back home</span><span class="button-wrap__right-circle"></span></span></span></a>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/art.js"></script>
<script src="js/core.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
